```properties
spring.application.name=hotelbooking

# Server port: local 4000, Railway uses its assigned PORT
server.port=${PORT:4000}

# MySQL database connection
# Local database: hotel_booking_db
# Online: set DB_URL in Railway Variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_booking_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
```

