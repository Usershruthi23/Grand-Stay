spring.application.name=hotelbooking

# Dynamic port for Render ($PORT) with fallback to 4000 for local dev
server.port=${PORT:4000}

# Database configuration
# In Render Environment Variables, set DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Cookie security settings for cross-origin deployments
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=false